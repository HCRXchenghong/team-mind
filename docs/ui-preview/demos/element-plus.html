<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Element Plus · TeamMind 预览</title>
<link rel="stylesheet" href="../vendor/element-plus.css">
<link rel="stylesheet" href="../vendor/element-plus-dark.css">
<link rel="stylesheet" href="shell.css">
<style>
  :root { --tm-accent: #409eff; --tm-radius: 4px; }
  .tm-panel .el-table th.el-table__cell { background: var(--tm-panel-2); color: var(--tm-muted); font-weight: 600; font-size: 12px; }
  .tm-panel .el-table { --el-table-bg-color: transparent; --el-table-tr-bg-color: transparent; --el-table-header-bg-color: var(--tm-panel-2); --el-table-border-color: var(--tm-border); --el-table-text-color: var(--tm-text); --el-table-header-text-color: var(--tm-muted); }
  .tm-panel .el-table td.el-table__cell, .tm-panel .el-table th.el-table__cell { padding: 9px 0; }
  .el-card { --el-card-bg-color: var(--tm-panel); --el-card-border-color: var(--tm-border); }
  .tm-kpi .el-card__body { padding: 14px 16px; }
  .el-tag { --el-tag-border-radius: 3px; }
</style>
</head>
<body>
<div id="boot-error" class="tm-boot-error" style="display:none"></div>
<div id="app" v-cloak>
  <div class="tm-app">
    <aside class="tm-side">
      <div class="tm-logo"><span class="tm-logo-mark">T</span> TeamMind</div>
      <nav class="tm-nav">
        <div class="tm-nav-label">工作台</div>
        <a class="tm-nav-item"><span class="dot"></span>总览</a>
        <a class="tm-nav-item active"><span class="dot"></span>任务中心</a>
        <a class="tm-nav-item"><span class="dot"></span>项目管理</a>
        <a class="tm-nav-item"><span class="dot"></span>甘特图</a>
        <div class="tm-nav-label">协作</div>
        <a class="tm-nav-item"><span class="dot"></span>审批中心</a>
        <a class="tm-nav-item"><span class="dot"></span>成员</a>
      </nav>
      <div class="tm-side-foot">Element Plus<br>2.14.7 · 饿了么</div>
    </aside>

    <div class="tm-main">
      <header class="tm-top">
        <div class="tm-crumb">工作台 / <b>任务中心</b></div>
        <div class="tm-top-right">
          <el-select model-value="tm" size="small" style="width: 132px">
            <el-option label="TeamMind 团队" value="tm"></el-option>
            <el-option label="AI 实验室" value="lab"></el-option>
          </el-select>
          <button class="tm-theme-btn" @click="toggleTheme">{{ dark ? '☀ 浅色' : '☾ 深色' }}</button>
          <span class="tm-avatar">林</span>
        </div>
      </header>

      <div class="tm-content">
        <div class="tm-head">
          <div>
            <h1>任务中心</h1>
            <p>6 个任务 · 2 个阻塞 · 本周 3 个到期</p>
          </div>
          <el-button type="primary" @click="createOpen = true">+ 新建任务</el-button>
        </div>

        <div class="tm-kpis">
          <el-card v-for="k in kpis" :key="k.label" class="tm-kpi" shadow="never">
            <div class="tm-kpi-top"><span>{{ k.label }}</span><span>{{ k.tag }}</span></div>
            <div class="tm-kpi-value">{{ k.value }}</div>
            <div class="tm-kpi-foot" v-html="k.foot"></div>
            <div class="tm-kpi-spark"><i :style="{ width: k.pct + '%' }"></i></div>
          </el-card>
        </div>

        <div class="tm-filters">
          <el-input v-model="q" placeholder="搜索任务标题" clearable style="width: 210px"></el-input>
          <el-select v-model="status" style="width: 128px">
            <el-option label="全部状态" value="all"></el-option>
            <el-option label="待开始" value="todo"></el-option>
            <el-option label="进行中" value="doing"></el-option>
            <el-option label="阻塞" value="blocked"></el-option>
            <el-option label="待审查" value="review"></el-option>
            <el-option label="已完成" value="done"></el-option>
          </el-select>
          <el-select v-model="project" style="width: 150px">
            <el-option label="全部项目" value="all"></el-option>
            <el-option label="工作台 2.0" value="工作台 2.0"></el-option>
            <el-option label="智能助手" value="智能助手"></el-option>
            <el-option label="流程引擎" value="流程引擎"></el-option>
            <el-option label="设置中心" value="设置中心"></el-option>
          </el-select>
          <el-button :type="mine ? 'primary' : 'default'" @click="mine = !mine">我的任务</el-button>
          <el-button @click="reset">重置</el-button>
        </div>

        <div class="tm-panel">
          <div class="tm-table-wrap">
            <el-table :data="filtered" row-key="id" style="width: 100%" size="default">
              <el-table-column label="任务" width="260">
                <template #default="{ row }">
                  <div class="tm-cell-title">{{ row.title }}</div>
                  <div class="tm-cell-sub">{{ row.project }} · #{{ 1200 + row.id }}</div>
                </template>
              </el-table-column>
              <el-table-column label="状态" width="100">
                <template #default="{ row }">
                  <el-tag :type="statusType(row.status)" size="small" effect="light">{{ statusLabel(row.status) }}</el-tag>
                </template>
              </el-table-column>
              <el-table-column label="优先级" width="92">
                <template #default="{ row }">
                  <el-tag :type="priorityType(row.priority)" size="small" effect="plain">{{ priorityLabel(row.priority) }}</el-tag>
                </template>
              </el-table-column>
              <el-table-column label="负责人" width="124">
                <template #default="{ row }">
                  <div class="tm-who"><i :class="{ none: row.assignee === '未分配' }">{{ row.assignee.slice(0, 1) }}</i>{{ row.assignee }}</div>
                </template>
              </el-table-column>
              <el-table-column label="进度" width="160">
                <template #default="{ row }">
                  <div class="tm-progress">
                    <el-progress :percentage="row.progress" :show-text="false" :stroke-width="6" style="flex:1"></el-progress>
                    <span class="tm-progress-num">{{ row.progress }}%</span>
                  </div>
                </template>
              </el-table-column>
              <el-table-column label="截止" min-width="84" prop="due"></el-table-column>
              <el-table-column label="操作" min-width="116">
                <template #default>
                  <div class="tm-actions">
                    <el-button link type="primary" size="small">详情</el-button>
                    <el-button link size="small">编辑</el-button>
                  </div>
                </template>
              </el-table-column>
              <template #empty><div class="tm-empty">没有符合条件的任务</div></template>
            </el-table>
          </div>
          <div class="tm-table-foot">
            <span>共 {{ filtered.length }} 条 · 每页 10 条</span>
            <el-pagination small layout="prev, pager, next" :total="filtered.length" :page-size="10"></el-pagination>
          </div>
        </div>
        <div class="tm-hint">真实组件渲染：Element Plus 2.14（UMD）。表格、标签、进度条、分页、弹窗均为库内置组件。</div>
      </div>
    </div>
  </div>

  <el-dialog v-model="createOpen" title="新建任务" width="480px">
    <el-form label-position="top">
      <el-form-item label="任务标题"><el-input v-model="draft.title" placeholder="例如：补齐审批流批量处理"></el-input></el-form-item>
      <el-form-item label="所属项目">
        <el-select v-model="draft.project" style="width: 100%">
          <el-option label="工作台 2.0" value="工作台 2.0"></el-option>
          <el-option label="智能助手" value="智能助手"></el-option>
        </el-select>
      </el-form-item>
    </el-form>
    <template #footer>
      <el-button @click="createOpen = false">取消</el-button>
      <el-button type="primary" @click="createOpen = false">创建</el-button>
    </template>
  </el-dialog>
</div>

<script src="../vendor/vue.global.prod.js"></script>
<script src="../vendor/element-plus.min.js"></script>
<script>
window.addEventListener('error', function (e) {
  var el = document.getElementById('boot-error');
  el.style.display = 'block';
  el.textContent = 'JS ERROR: ' + e.message;
});
const { createApp, ref, reactive, computed, watchEffect } = Vue;

const rows = [
  { id: 1, title: '重构任务详情抽屉', project: '工作台 2.0', status: 'doing', priority: 'high', assignee: '林雅', due: '11-06', progress: 65 },
  { id: 2, title: '甘特图依赖连线', project: '工作台 2.0', status: 'blocked', priority: 'urgent', assignee: '陈默', due: '11-03', progress: 30 },
  { id: 3, title: '审批流批量处理', project: '流程引擎', status: 'review', priority: 'medium', assignee: '苏禾', due: '11-12', progress: 88 },
  { id: 4, title: '通知免打扰配置', project: '设置中心', status: 'todo', priority: 'low', assignee: '未分配', due: '11-18', progress: 0 },
  { id: 5, title: 'AI 会话摘要缓存', project: '智能助手', status: 'done', priority: 'medium', assignee: '周野', due: '10-29', progress: 100 },
  { id: 6, title: '公开甘特链接轮换', project: '工作台 2.0', status: 'doing', priority: 'high', assignee: '林雅', due: '11-09', progress: 45 },
];

createApp({
  setup() {
    const q = ref('');
    const status = ref('all');
    const project = ref('all');
    const mine = ref(false);
    const dark = ref(false);
    const createOpen = ref(false);
    const draft = reactive({ title: '', project: '工作台 2.0' });

    const filtered = computed(() => rows.filter((r) => {
      if (q.value && !r.title.includes(q.value)) return false;
      if (status.value !== 'all' && r.status !== status.value) return false;
      if (project.value !== 'all' && r.project !== project.value) return false;
      if (mine.value && r.assignee !== '林雅') return false;
      return true;
    }));

    const kpis = [
      { label: '进行中', value: 12, tag: '+3 本周', foot: '较上周 <span class="up">↑ 12%</span>', pct: 62 },
      { label: '阻塞', value: 2, tag: '需处理', foot: '平均阻塞 <span class="down">1.8 天</span>', pct: 18 },
      { label: '待审批', value: 5, tag: '提案', foot: '本周已处理 9 条', pct: 40 },
      { label: '本周完成', value: 18, tag: '目标 24', foot: '完成率 <span class="up">75%</span>', pct: 75 },
    ];

    const statusMap = { todo: '待开始', doing: '进行中', blocked: '阻塞', review: '待审查', done: '已完成' };
    const statusType = (s) => ({ todo: 'info', doing: 'primary', blocked: 'danger', review: 'warning', done: 'success' })[s] || 'info';
    const priorityMap = { low: '低', medium: '中', high: '高', urgent: '紧急' };
    const priorityType = (p) => ({ low: 'info', medium: 'primary', high: 'warning', urgent: 'danger' })[p] || 'info';

    function reset() { q.value = ''; status.value = 'all'; project.value = 'all'; mine.value = false; }
    function toggleTheme() { dark.value = !dark.value; }

    watchEffect(() => {
      document.documentElement.classList.toggle('dark', dark.value);
      document.body.classList.toggle('dark', dark.value);
    });

    return {
      q, status, project, mine, dark, createOpen, draft, filtered, kpis,
      statusLabel: (s) => statusMap[s] || s, statusType,
      priorityLabel: (p) => priorityMap[p] || p, priorityType,
      reset, toggleTheme,
    };
  },
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
